name: offline-check

# $0 and no secrets: runs the whole pipeline against a fake client and validates
# every request against the pinned anthropic SDK (tests/offline_check.py).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python tests/offline_check.py
