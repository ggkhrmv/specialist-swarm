<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ── Fonts: embedded by build_deck.py (Instrument Serif, Geist, Geist Mono; SIL OFL 1.1) ── */
{{FONT_FACES}}

/* ── BTS-Synthetic tokens. Components use these by name; never a raw value. ── */
:root {
  /* Brand ramp: deep petrol */
  --brand-100: #E1EDEA;
  --brand-200: #A9CFC9;
  --brand-300: #4E8F88;   /* marks only (3.4:1 on paper), never text */
  --brand-400: #146B64;   /* primary; text-safe on paper, paper-2, brand-100 */
  --brand-500: #0B3B3A;   /* inverse surfaces */

  /* Warm neutrals */
  --paper: #F7F5F0;
  --paper-2: #EDE9E0;
  --rule: #DDD8CC;
  --rule-strong: #B9B2A3;
  --soft: #6B655A;        /* sublabels, captions: 4.8:1 on paper-2 */
  --muted: #46423B;       /* secondary text */
  --ink: #1C2023;         /* primary text */
  --stage: #2B2A27;       /* letterbox around the slide */

  /* Focal accent: copper. One or two marks per slide, never decoration */
  --accent: #B04A1A;      /* 5.0:1 on paper */
  --accent-tint: #F6E4DA;
  --accent-on-dark: #F08A5D; /* 5.0:1 on brand-500 */
  --on-dark: #F7F5F0;
  --on-dark-soft: #A9CFC9;

  /* Type */
  --font-display: "Instrument Serif", Georgia, serif;
  --font-sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", Menlo, monospace;

  /* Type scale on the 1600x900 canvas */
  --fs-tag: 14px;
  --fs-small: 16px;
  --fs-caption: 18px;
  --fs-body: 22px;
  --fs-lead: 28px;
  --fs-h3: 34px;
  --fs-title: 58px;
  --fs-figure: 84px;
  --fs-cover: 104px;

  /* Space (4px grid) */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  --corner: 2px;
  --hairline: 1px solid var(--rule);
  --dur-fast: 160ms;
  --dur-grow: 700ms;
  --ease: cubic-bezier(.2, .7, .2, 1);

  --slide-w: 1600px;
  --slide-h: 900px;
  --scale: 1;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "tnum";
  overflow: hidden;
}

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ── Deck stage ── */
.deck { position: fixed; inset: 0; }
.slide {
  position: absolute; left: 50%; top: 50%;
  width: var(--slide-w); height: var(--slide-h);
  transform: translate(-50%, -50%) scale(var(--scale));
  transform-origin: center;
  background: var(--paper);
  padding: 72px 96px 112px;
  display: flex; flex-direction: column; gap: var(--s-6);
  overflow: hidden;
}
.js .slide { visibility: hidden; }
.js .slide.is-active { visibility: visible; }
body.notes-open .slide { top: calc(50% - 90px); }

/* Footer chrome, injected by the script on every slide except the cover */
.slide__chrome {
  position: absolute; left: 96px; right: 96px; bottom: 40px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  font-family: var(--font-mono); font-size: var(--fs-tag); color: var(--soft);
  border-top: var(--hairline); padding-top: var(--s-4);
}
.chrome__brand { display: inline-flex; align-items: center; gap: var(--s-2);
  font-family: var(--font-sans); font-weight: 600; color: var(--ink); font-size: var(--fs-small); }
.chrome__brand .mark { width: 18px; height: 18px; color: var(--brand-400); }
.chrome__meta { text-align: center; }
.chrome__num { text-align: right; }
.slide--cover .slide__chrome { display: none; }

/* ── Headings and text ── */
.title {
  font-family: var(--font-display); font-weight: 400;
  font-size: var(--fs-title); line-height: 1.04; letter-spacing: -0.01em;
  margin: 0; max-width: 1280px; color: var(--ink); text-wrap: balance;
}
.title em { font-style: italic; color: var(--brand-400); }
.lead { font-size: var(--fs-lead); line-height: 1.35; color: var(--muted); margin: 0; max-width: 1080px; text-wrap: pretty; }
.h3 { font-family: var(--font-sans); font-weight: 600; font-size: var(--fs-h3); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
.label { font-family: var(--font-sans); font-weight: 500; font-size: var(--fs-caption); color: var(--soft); margin: 0 0 var(--s-3); }
p { margin: 0; }
strong { font-weight: 600; color: var(--ink); }
.muted { color: var(--muted); }
.source { font-family: var(--font-mono); font-size: var(--fs-tag); color: var(--soft); margin-top: auto; }

/* ── Layout ── */
.body { flex: 1; min-height: 0; display: grid; gap: var(--s-7); align-content: center; align-items: center; }
.body.top { align-content: start; align-items: start; }
.g-7-5 { grid-template-columns: 7fr 5fr; }
.g-5-7 { grid-template-columns: 5fr 7fr; }
.g-1-1 { grid-template-columns: 1fr 1fr; }
.g-3   { grid-template-columns: 1.15fr 1fr .9fr; }
.stack { display: flex; flex-direction: column; gap: var(--s-5); min-width: 0; }
.center { align-content: center; }

/* ── Headline figures ── */
.kpis { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s-4); }
.kpis--stack { grid-auto-flow: row; }
.kpi { background: var(--paper-2); padding: var(--s-5) var(--s-5) var(--s-5); border-radius: var(--corner);
  display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; }
.kpi__figure { font-family: var(--font-display); font-size: var(--fs-figure); line-height: .95; letter-spacing: -0.02em; color: var(--ink); }
.kpi__figure small { font-size: .45em; letter-spacing: 0; color: var(--muted); margin-left: var(--s-1); }
.kpi__label { font-size: var(--fs-caption); color: var(--muted); line-height: 1.3; }
.kpi--inverse { background: var(--brand-500); }
.kpi--inverse .kpi__figure { color: var(--on-dark); }
.kpi--inverse .kpi__figure small, .kpi--inverse .kpi__label { color: var(--on-dark-soft); }

/* ── Point list with hairlines ── */
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.points li { border-top: var(--hairline); padding: var(--s-5) 0; display: grid; grid-template-columns: 28px 1fr; gap: var(--s-4); }
.points li:last-child { border-bottom: var(--hairline); }
.points .icon { width: 24px; height: 24px; color: var(--brand-400); margin-top: 3px; }
.points strong { display: block; font-size: 25px; line-height: 1.25; margin-bottom: var(--s-1); }
.points span { color: var(--muted); font-size: 20px; line-height: 1.4; }
.points--plain li { grid-template-columns: 1fr; }

/* ── Insight callout ── */
.callout { border-left: 4px solid var(--brand-400); background: var(--brand-100);
  padding: var(--s-4) var(--s-5); font-size: var(--fs-body); color: var(--ink); border-radius: 0 var(--corner) var(--corner) 0; }
.callout--focal { border-left-color: var(--accent); background: var(--accent-tint); }

/* ── Inverse tile (one per slide at most) ── */
.inverse { background: var(--brand-500); color: var(--on-dark); padding: var(--s-6); border-radius: var(--corner); }
.inverse strong { color: var(--on-dark); }
.inverse .label, .inverse .muted { color: var(--on-dark-soft); }

/* ── Tags ── */
.tag { display: inline-block; font-family: var(--font-mono); font-weight: 500; font-size: var(--fs-tag);
  line-height: 1; padding: 6px 8px; border-radius: var(--corner); white-space: nowrap;
  background: var(--paper-2); color: var(--muted); }
.tag--accept, .tag--low  { background: var(--brand-100); color: var(--brand-400); }
.tag--counter, .tag--med { background: var(--paper); color: var(--ink); outline: 1px solid var(--rule-strong); outline-offset: -1px; }
.tag--decline, .tag--high { background: var(--accent-tint); color: var(--accent); }

/* ── Table ── */
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-caption); }
.table th { text-align: left; font-weight: 500; font-size: var(--fs-small); color: var(--soft);
  padding: 0 var(--s-4) var(--s-3) 0; border-bottom: 1px solid var(--rule-strong); }
.table td { padding: var(--s-3) var(--s-4) var(--s-3) 0; border-bottom: var(--hairline); vertical-align: top; color: var(--muted); }
.table td:first-child { color: var(--ink); font-weight: 500; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* ── Sequence (real sequences only) ── */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--s-4); counter-reset: step; }
.steps li { border-top: 2px solid var(--rule-strong); padding-top: var(--s-4); counter-increment: step; position: relative; }
.steps li::before { content: counter(step); font-family: var(--font-mono); font-size: var(--fs-tag); color: var(--soft); display: block; margin-bottom: var(--s-2); }
.steps time { display: block; font-family: var(--font-mono); font-size: var(--fs-tag); color: var(--soft); margin-top: var(--s-2); }
.steps strong { display: block; font-size: var(--fs-caption); }
.steps span { font-size: var(--fs-small); color: var(--muted); }
.steps li.is-now { border-top-color: var(--accent); }
.steps li.is-now::before { color: var(--accent); }

/* ── Figures and SVG diagrams ── */
.figure { margin: 0; display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
.figure figcaption { font-size: var(--fs-small); color: var(--soft); }
.figure svg { width: 100%; height: auto; display: block; }

.dg text { font-family: var(--font-sans); fill: var(--ink); }
.dg .dg-name   { font-weight: 600; font-size: 20px; fill: var(--ink); }
.dg .dg-sub    { font-family: var(--font-mono); font-size: 15px; fill: var(--soft); }
.dg .dg-label  { font-family: var(--font-mono); font-size: 14px; fill: var(--muted); }
.dg .dg-axis   { font-family: var(--font-mono); font-size: 14px; fill: var(--soft); }
.dg .dg-value  { font-family: var(--font-display); font-size: 34px; fill: var(--ink); }
.dg .dg-value--focal, .dg .dg-name--focal { fill: var(--accent); }
.dg .dg-callout { font-family: var(--font-display); font-style: italic; font-size: 22px; fill: var(--muted); }
.dg .dg-mask   { fill: var(--paper); }
.dg .dg-box    { fill: var(--paper); stroke: var(--rule-strong); stroke-width: 1.5; }
.dg .dg-box--brand { fill: var(--brand-100); stroke: var(--brand-400); }
.dg .dg-box--focal { fill: var(--accent-tint); stroke: var(--accent); }
.dg .dg-box--quiet { fill: var(--paper-2); stroke: var(--rule); }
.dg .dg-area   { fill: var(--brand-100); }
.dg .dg-zone   { fill: none; stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 4 4; }
.dg .dg-grid   { stroke: var(--rule); stroke-width: 1; fill: none; }
.dg .dg-baseline { stroke: var(--rule-strong); stroke-width: 1.5; fill: none; }
.dg .dg-line   { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg .dg-line--focal { stroke: var(--accent); stroke-width: 2; }
.dg .dg-line--brand { stroke: var(--brand-400); stroke-width: 2; }
.dg .dg-line--dash  { stroke-dasharray: 5 4; }
.dg .dg-bar        { fill: var(--brand-400); }
.dg .dg-bar--light { fill: var(--brand-200); }
.dg .dg-bar--quiet { fill: var(--paper-2); stroke: var(--rule-strong); stroke-width: 1; }
.dg .dg-bar--focal { fill: var(--accent); }
.dg .dg-dot        { fill: var(--brand-400); }
.dg .dg-dot--quiet { fill: var(--rule-strong); }
.dg .dg-dot--focal { fill: var(--accent); }
.dg .dg-marker       { fill: var(--muted); }
.dg .dg-marker--focal { fill: var(--accent); }
.dg-marker       { fill: var(--muted); }
.dg-marker--focal { fill: var(--accent); }

/* The one orchestrated moment: bars and lines grow when their slide opens */
   (the resting state is always the complete chart, so print and no-JS views are whole) */
.dg .grow, .dg .grow-x { transform-box: fill-box; }
.dg .grow   { transform-origin: 50% 100%; }
.dg .grow-x { transform-origin: 0 50%; }
.slide.is-active .dg .grow   { animation: grow-y var(--dur-grow) var(--ease) both; animation-delay: calc(var(--i, 0) * 120ms); }
.slide.is-active .dg .grow-x { animation: grow-x var(--dur-grow) var(--ease) both; animation-delay: calc(var(--i, 0) * 120ms); }
@keyframes grow-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ── Cover: the deck's one gradient surface ── */
.slide--cover {
  background: radial-gradient(120% 140% at 100% 0%, var(--brand-400) 0%, var(--brand-500) 58%);
  color: var(--on-dark); padding: 88px 96px; justify-content: space-between;
}
.cover__top { display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: var(--fs-small); color: var(--on-dark-soft); }
.cover__brand { display: inline-flex; align-items: center; gap: var(--s-3); font-family: var(--font-sans);
  font-weight: 600; font-size: var(--fs-lead); color: var(--on-dark); letter-spacing: -0.01em; }
.cover__brand .mark { width: 36px; height: 36px; color: var(--on-dark); }
.cover__title { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-cover);
  line-height: .98; letter-spacing: -0.02em; margin: 0; max-width: 1320px; text-wrap: balance; color: var(--on-dark); }
.cover__title em { font-style: italic; color: var(--accent-on-dark); }
.cover__sub { font-size: var(--fs-lead); color: var(--on-dark-soft); max-width: 980px; margin-top: var(--s-5); line-height: 1.35; }
.cover__facts { display: grid; grid-auto-flow: column; grid-auto-columns: max-content; gap: var(--s-8);
  border-top: 1px solid var(--brand-300); padding-top: var(--s-5); }
.cover__facts dt { font-family: var(--font-mono); font-size: var(--fs-tag); color: var(--on-dark-soft); margin-bottom: var(--s-2); }
.cover__facts dd { margin: 0; font-family: var(--font-display); font-size: 44px; line-height: 1; color: var(--on-dark); }

/* ── Speaker notes (hidden on the slide; shown in the notes panel) ── */
.notes { display: none; }
.notes-panel {
  position: fixed; left: 0; right: 0; bottom: 0; height: 180px; overflow: auto;
  background: var(--ink); color: var(--paper); border-top: 1px solid var(--muted);
  padding: var(--s-4) var(--s-6); font-size: var(--fs-small); line-height: 1.5; z-index: 20;
}
.notes-panel[hidden] { display: none; }
.notes-panel b { font-family: var(--font-mono); font-weight: 500; color: var(--brand-200); margin-right: var(--s-2); }

/* ── Presenter controls ── */
.controls {
  position: fixed; right: var(--s-5); bottom: var(--s-5); z-index: 30;
  display: flex; align-items: center; gap: var(--s-1);
  background: var(--ink); border-radius: var(--corner); padding: var(--s-1);
  font-family: var(--font-mono); font-size: var(--fs-tag); color: var(--paper);
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
body.idle .controls:not(:focus-within) { transform: translateY(200%); }
body.notes-open .controls { bottom: calc(180px + var(--s-4)); }
.controls button {
  appearance: none; border: 0; background: transparent; color: inherit; cursor: pointer;
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--corner);
  transition: background var(--dur-fast);
}
.controls button:hover { background: var(--muted); }
.controls button:focus-visible { outline: 2px solid var(--accent-on-dark); outline-offset: 1px; }
.controls button[aria-pressed="true"] { background: var(--brand-400); }
.controls svg { width: 20px; height: 20px; }
.controls output { min-width: 56px; text-align: center; }
.icon { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

@media (prefers-reduced-motion: reduce) {
  .controls { transition: none; }
  .slide.is-active .dg .grow, .slide.is-active .dg .grow-x { animation: none; }
}

/* ── Print / Save as PDF: one slide per page, no scaling ── */
@page { size: 1600px 900px; margin: 0; }
@media print {
  html, body { height: auto; overflow: visible; background: var(--paper); }
  .deck { position: static; }
  .slide, .js .slide { position: relative; left: auto; top: auto; transform: none; visibility: visible; break-after: page; }
  .slide:last-of-type { break-after: auto; }
  .slide.is-active .dg .grow, .slide.is-active .dg .grow-x { animation: none; }
  .controls, .notes-panel { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body class="idle" data-context="{{CONTEXT}}">

<!-- Sprite: brand mark, monoline icons, diagram arrow markers. Reference with <use href="#…">. -->
<svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="bts-mark" viewBox="0 0 32 32">
      <rect x="0" y="0" width="13" height="32" fill="currentColor"/>

      <rect x="17" y="18" width="15" height="14" fill="currentColor" opacity=".5"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path class="icon" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

<main class="deck" id="deck" aria-roledescription="slide deck" aria-label="{{TITLE}}">
{{SLIDES}}
</main>

<div class="notes-panel" id="notes" hidden aria-live="polite"></div>

<nav class="controls" aria-label="Slide controls">
  <button type="button" data-act="prev" aria-label="Previous slide"><svg><use href="#i-prev"/></svg></button>
  <output id="counter" aria-live="polite">1 / 1</output>
  <button type="button" data-act="next" aria-label="Next slide"><svg><use href="#i-next"/></svg></button>
  <button type="button" data-act="notes" aria-label="Speaker notes (N)" aria-pressed="false"><svg><use href="#i-notes"/></svg></button>
  <button type="button" data-act="full" aria-label="Full screen (F)"><svg><use href="#i-full"/></svg></button>
</nav>

<script>
(function () {
  "use strict";
  document.documentElement.classList.add("js");
  var W = 1600, H = 900, NOTES_H = 180;
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var counter = document.getElementById("counter");
  var notesPanel = document.getElementById("notes");
  var context = document.body.getAttribute("data-context") || "";
  var current = 0;

  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  slides.forEach(function (slide, i) {
    slide.id = slide.id || "slide-" + (i + 1);
    slide.setAttribute("aria-roledescription", "slide");
    slide.setAttribute("aria-label", (i + 1) + " of " + slides.length);
    var chrome = document.createElement("div");
    chrome.className = "slide__chrome";
    chrome.setAttribute("aria-hidden", "true");
    chrome.innerHTML =
      '<span class="chrome__brand"><svg class="mark"><use href="#bts-mark"/></svg>BTS-Synthetic</span>' +
      '<span class="chrome__meta">' + esc(context) + "</span>" +
      '<span class="chrome__num">' + (i + 1) + " / " + slides.length + "</span>";
    slide.appendChild(chrome);
  });

  function fit() {
    var availH = window.innerHeight - (document.body.classList.contains("notes-open") ? NOTES_H : 0);
    var s = Math.min(window.innerWidth / W, availH / H);
    document.documentElement.style.setProperty("--scale", String(s));
  }

  function renderNotes() {
    var aside = slides[current] && slides[current].querySelector(".notes");
    notesPanel.innerHTML = "<b>" + (current + 1) + " / " + slides.length + "</b>" +
      (aside ? aside.innerHTML : "<i>No notes for this slide.</i>");
  }

  function go(i) {
    if (!slides.length) return;
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, k) {
      var on = k === current;
      s.classList.toggle("is-active", on);
      if (on) s.removeAttribute("aria-hidden"); else s.setAttribute("aria-hidden", "true");
    });
    counter.textContent = (current + 1) + " / " + slides.length;
    if (history.replaceState) history.replaceState(null, "", "#" + (current + 1));
    renderNotes();
  }

  function toggleNotes() {
    var open = notesPanel.hasAttribute("hidden");
    if (open) notesPanel.removeAttribute("hidden"); else notesPanel.setAttribute("hidden", "");
    document.body.classList.toggle("notes-open", open);
    document.querySelector('[data-act="notes"]').setAttribute("aria-pressed", String(open));
    fit();
  }

  function toggleFull() {
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); }
    else if (document.exitFullscreen) { document.exitFullscreen(); }
  }

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "ArrowDown") { e.preventDefault(); go(current + 1); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "ArrowUp" || k === "Backspace") { e.preventDefault(); go(current - 1); }
    else if (k === "Home") { go(0); }
    else if (k === "End") { go(slides.length - 1); }
    else if (k === "n" || k === "N") { toggleNotes(); }
    else if (k === "f" || k === "F") { toggleFull(); }
    else if (/^[1-9]$/.test(k)) { go(parseInt(k, 10) - 1); }
  });

  document.querySelector(".controls").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "prev") go(current - 1);
    else if (act === "next") go(current + 1);
    else if (act === "notes") toggleNotes();
    else if (act === "full") toggleFull();
  });

  var x0 = null;
  document.addEventListener("pointerdown", function (e) { x0 = e.clientX; });
  document.addEventListener("pointerup", function (e) {
    if (x0 === null || e.pointerType === "mouse") { x0 = null; return; }
    var dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) go(current + (dx < 0 ? 1 : -1));
  });

  var idleTimer;
  function wake() { document.body.classList.remove("idle"); clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add("idle"); }, 2500); }
  document.addEventListener("mousemove", wake);

  window.addEventListener("resize", fit);
  window.addEventListener("beforeprint", function () { slides.forEach(function (s) { s.classList.add("is-active"); }); });
  window.addEventListener("afterprint", function () { go(current); });

  fit();
  var start = parseInt((location.hash || "#1").slice(1), 10);
  go(isNaN(start) ? 0 : start - 1); // controls stay hidden until the mouse moves or they get focus
})();
</script>
</body>
</html>
